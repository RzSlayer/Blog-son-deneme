/* BURAYA SUPABASE BİLGİLERİNİ YAZACAĞIZ */
const SUPABASE_URL = "BURAYA_SUPABASE_URL";
const SUPABASE_ANON_KEY = "BURAYA_SUPABASE_ANON_KEY";

const ready =
  !SUPABASE_URL.includes("BURAYA_") &&
  !SUPABASE_ANON_KEY.includes("BURAYA_");

const sb = ready
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

  ["dizi-film","🎬","Dizi & Film"],

  ["teknoloji","💻","Teknoloji"],
  ["blender","🎨","Blender / Tasarım"],
  ["yazarlik","✍️","Yazarlık"],
  ["internet","🌐","İnternet Kültürü"],
  ["dusunceler","💭","Kişisel Düşünceler"],
  ["random","🔥","Rastgele"]
];

const catName = s =>

/* YARDIMCI FONKSİYONLAR */

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}


function fmt(d){
  return new Date(d).toLocaleDateString("tr-TR",{
    day:"numeric",
    month:"long",
    year:"numeric"
  });
}


function slugify(s){
  return s
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");
}


/* BASİT MARKDOWN */

function markdown(s){

  let x = esc(s);

  x = x
    .replace(/^### (.*)$/gm,"<h2>$1</h2>")
    .replace(/^## (.*)$/gm,"<h2>$1</h2>");

  x = x.replace(/^\- (.*)$/gm,"<li>$1</li>");

  x = x.replace(
    /(<li>.*<\/li>)/gs,
    "<ul>$1</ul>"
  );

  return x
    .split(/\n{2,}/)
    .map(b =>
      b.trim().startsWith("<h2>") ||
      b.trim().startsWith("<ul>")
        ? b
        : `<p>${b.replace(/\n/g,"<br>")}</p>`
    )
    .join("");
}


/* VERİLERİ YÜKLE */

async function load(){

  if(!sb){
    render();
    return;
  }

  const {data,error} =
    await sb
      .from("posts")
      .select("*")
      .eq("published",true)
      .order("published_at",{ascending:false});

  state.posts = error ? [] : (data || []);

  const {data:u} =
    await sb.auth.getUser();

  state.admin = !!u?.user;

  render();
}


/* NAVİGASYON */

function navigate(page,extra={}){

  state = {
    ...state,
    page,
    ...extra
  };

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  render();
}

/* GİRİŞ YAP */

async function loginAdmin(){

  if(!sb) return;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;


  const {error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  document.getElementById("loginMsg")
    .textContent =
      error
        ? error.message
        : "Giriş başarılı.";


  if(!error){

    const {data:u} =
      await sb.auth.getUser();

    state.admin = !!u?.user;

    navigate("admin");
  }
}


/* ÇIKIŞ */

async function logoutAdmin(){

  await sb.auth.signOut();

  state.admin = false;

  navigate("home");
}


/* YAZI DÜZENLE */

function editPost(id){

  state.editing =
    id
      ? state.posts.find(p => p.id === id)
      : null;

  navigate("editor");
}


/* YAZI KAYDET */

async function savePost(){

  const g = id =>
    document.getElementById(id).value;


  const published =
    document.getElementById(
      "fPublished"
    ).checked;


  const payload = {

    title:g("fTitle"),

    slug:slugify(
      g("fTitle")
    ),

    excerpt:g("fExcerpt"),

    category:g("fCategory"),

    tags:
      g("fTags")
        .split(",")
        .map(x => x.trim())
        .filter(Boolean),

    cover_url:g("fCover"),

    content:g("fContent"),

    read_time:
      Number(g("fRead")) || 5,

    published,

    published_at:
      published
        ? new Date().toISOString()
        : null
  };


  const msg =
    document.getElementById(
      "saveMsg"
    );


  if(
    !payload.title ||
    !payload.content
  ){

    msg.textContent =
      "Başlık ve yazı kısmını doldur.";

    return;
  }


  let result;


  if(state.editing){

    result =
      await sb
        .from("posts")
        .update(payload)
        .eq(
          "id",
          state.editing
        );

  }else{

    result =
      await sb
        .from("posts")
        .insert(payload);

  }


  if(result.error){

    msg.textContent =
      "Hata: " +
      result.error.message;

    return;
  }


  await load();

  navigate("admin");
}


/* YAZI SİL */

async function deletePost(id){

  if(
    !confirm(
      "Bu yazı silinsin mi?"
    )
  ) return;


  await sb
    .from("posts")
    .delete()
    .eq("id",id);


  await load();

  navigate("admin");
}


/* SAYFAYI ÇİZ */

function render(){

  let body = "";


  if(state.page === "home")
    body = home();

  if(state.page === "posts")
    body = postsPage();

  if(state.page === "categories")
    body = categories();

  if(state.page === "category")
    body = category();

  if(state.page === "post")
    body = article();

  if(state.page === "about")
    body = about();

  if(state.page === "admin")
    body = admin();

  if(state.page === "editor")
    body = editor();


  document.getElementById(
    "app"
  ).innerHTML =

    nav() +

    body +

    `

<footer
style="
border-top:1px solid var(--line);
padding:35px 20px;
text-align:center
">

<span class="serif">
Karanlık Dergi
</span>

<div
class="mono muted"
style="
font-size:10px;
margin-top:7px
">

Kendi köşende yazmaya devam et.

</div>

</footer>

`;


  if(window.lucide)
    lucide.createIcons();
}


/* AUTH */

if(sb){

  sb.auth.onAuthStateChange(
    (_e,s) => {

      state.admin =
        !!s?.user;

      render();

    }
  );

}


/* BAŞLAT */

load();

</script>
